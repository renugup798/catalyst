[package]
name = "catalyst"
version = "0.1.0"
edition = "2021"
authors = ["renugup798"]
description = "Python-to-Rust conversion framework"
license = "MIT"
repository = "https://github.com/renugup798/catalyst"
keywords = ["python", "rust", "conversion", "migration", "interop"]
categories = ["development-tools", "development-tools::ffi"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
rayon = "1.7"

[dev-dependencies]
criterion = "0.5"
pytest = "7.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
